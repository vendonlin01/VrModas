<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Minhas Compras - VR Modas</title>
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/produtos.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0c0c0c;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }
        .container-meus-pedidos {
            max-width: 580px;
            margin: 16px auto 60px auto;
            padding: 0 12px;
        }
        .topo-pedidos-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }
        .btn-voltar-link {
            color: var(--dourado, #d4af37);
            text-decoration: none;
            font-size: 12.5px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        
        /* Card Compacto & Elegante */
        .card-pedido-cliente {
            background: #131313;
            border: 1px solid #222222;
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        .topo-card-pedido {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1c1c1c;
            padding-bottom: 10px;
            margin-bottom: 12px;
        }

        /* Linha do Tempo Compacta */
        .tracker-container {
            display: flex;
            justify-content: space-between;
            position: relative;
            margin: 14px 4px 12px 4px;
        }
        .tracker-container::before {
            content: '';
            position: absolute;
            top: 10px;
            left: 12px;
            right: 12px;
            height: 2px;
            background: #252525;
            z-index: 1;
        }
        .tracker-linha-ativa {
            position: absolute;
            top: 10px;
            left: 12px;
            height: 2px;
            background: var(--dourado, #d4af37);
            z-index: 2;
            transition: width 0.3s ease;
        }
        .tracker-passo {
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .tracker-circulo {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #161616;
            border: 2px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 800;
            color: #666;
        }
        .tracker-passo.ativo .tracker-circulo {
            background: var(--dourado, #d4af37);
            border-color: var(--dourado, #d4af37);
            color: #000;
        }
        .tracker-passo.concluido .tracker-circulo {
            background: #4cd137;
            border-color: #4cd137;
            color: #000;
        }
        .tracker-legenda {
            font-size: 9px;
            font-weight: 700;
            color: #555;
            text-transform: uppercase;
        }
        .tracker-passo.ativo .tracker-legenda { color: var(--dourado, #d4af37); }
        .tracker-passo.concluido .tracker-legenda { color: #aaa; }

        .loader-pedidos {
            text-align: center;
            color: var(--dourado, #d4af37);
            font-size: 13px;
            padding: 30px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <header class="header" style="border-bottom: 1px solid #1a1a1a; padding: 12px 16px;">
        <div class="logo">
            <a href="home.html" style="text-decoration: none;">
                <span class="logo-vr" style="color: var(--dourado, #d4af37); font-weight: 900; font-size: 18px;">VR</span> 
                <span class="logo-modas" style="color: #fff; font-weight: 900; font-size: 18px;">MODAS</span>
            </a>
        </div>
    </header>

    <main class="container-meus-pedidos">
        <div class="topo-pedidos-nav">
            <a href="home.html" class="btn-voltar-link">⬅ Voltar à Loja</a>
        </div>

        <h1 style="font-size: 19px; color: #fff; margin: 0 0 4px 0; font-weight: 800;">Minhas Compras</h1>
        <p style="color: #888; font-size: 12px; margin-bottom: 16px;">Acompanhe o andamento dos seus pedidos em tempo real.</p>

        <div id="lista-pedidos-cliente">
            <div class="loader-pedidos">Carregando pedidos...</div>
        </div>
    </main>

    <script src="js/db.js"></script>

    <script type="module">
        import { neon } from 'https://esm.sh/@neondatabase/serverless';

        // Tratamento seguro de cor para eliminar de vez [object Object]
        function extrairTextoCor(corRaw) {
            if (!corRaw) return 'Padrão';
            if (typeof corRaw === 'string') {
                try {
                    if (corRaw.trim().startsWith('{')) {
                        const parsed = JSON.parse(corRaw);
                        return parsed.nome || parsed.cor || 'Padrão';
                    }
                    return corRaw;
                } catch (e) {
                    return corRaw;
                }
            }
            if (typeof corRaw === 'object' && corRaw !== null) {
                return corRaw.nome || corRaw.cor || 'Padrão';
            }
            return String(corRaw);
        }

        function extrairTextoTamanho(tamRaw) {
            if (!tamRaw) return 'Padrão';
            if (typeof tamRaw === 'object' && tamRaw !== null) {
                return tamRaw.tamanho || tamRaw.tam || 'Padrão';
            }
            return String(tamRaw);
        }

        function formatarEnderecoCompleto(end) {
            if (!end) return 'Retirada na Loja Física';
            if (typeof end === 'string') {
                try {
                    if (end.trim().startsWith('{')) {
                        end = JSON.parse(end);
                    } else {
                        return end;
                    }
                } catch(e) {
                    return end;
                }
            }
            if (end.enderecoFormatado) return end.enderecoFormatado;
            const rua = end.rua || end.logradouro || '';
            const num = end.numero || 'S/N';
            const bairro = end.bairro || '';
            const cidade = end.cidade || '';
            const cep = end.cep ? `(CEP: ${end.cep})` : '';
            const partes = [rua ? `${rua}, Nº ${num}` : '', bairro, cidade, cep].filter(p => p.trim() !== '');
            return partes.length > 0 ? partes.join(' - ') : 'Retirada na Loja Física';
        }

        function calcularEtapaRastreio(statusRaw) {
            const s = String(statusRaw || 'pendente').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();

            if (s.includes('cancel')) {
                return { passo: 0, porcentagem: '0%', texto: 'Pedido Cancelado', cor: '#ef5350' };
            }
            if (s.includes('conclu') || s.includes('pago') || s.includes('entreg')) {
                return { passo: 4, porcentagem: '100%', texto: 'Entregue / Concluído', cor: '#4caf50' };
            }
            if (s.includes('envi')) {
                return { passo: 3, porcentagem: '68%', texto: 'A Caminho', cor: '#ffa726' };
            }
            if (s.includes('separ')) {
                return { passo: 2, porcentagem: '36%', texto: 'Em Separação', cor: '#ab47bc' };
            }
            return { passo: 1, porcentagem: '10%', texto: 'Confirmado', cor: 'var(--dourado, #d4af37)' };
        }

        function obterNumeroSuporteDinamico() {
            try {
                const configSalva = JSON.parse(localStorage.getItem('vr_configuracoes_loja') || '{}');
                return configSalva.whatsapp ? configSalva.whatsapp.replace(/\D/g, '') : '';
            } catch (e) {
                return '';
            }
        }

        async function obterInstanciaSqlSegura() {
            if (typeof window.getSql === 'function') {
                const s = await window.getSql();
                if (s) return s;
            }
            if (window.sql) return window.sql;

            const connStr = window.NEON_DATABASE_URL || 
                            window.DATABASE_URL || 
                            sessionStorage.getItem('vr_neon_url');

            if (connStr) return neon(connStr);
            return null;
        }

        async function carregarPedidosTela() {
            const container = document.getElementById('lista-pedidos-cliente');
            if (!container) return;

            const clienteSessao = JSON.parse(sessionStorage.getItem('vr_usuario_ativo')) || 
                                  JSON.parse(sessionStorage.getItem('vr_cliente_dados')) || 
                                  JSON.parse(localStorage.getItem('vr_cliente_dados')) || null;

            let pedidosExibir = [];

            try {
                const sql = await obterInstanciaSqlSegura();
                
                if (sql) {
                    let dadosBanco = [];
                    if (clienteSessao && (clienteSessao.email || clienteSessao.nome)) {
                        const emailFiltro = (clienteSessao.email || '').toLowerCase().trim();
                        const nomeFiltro = `%${(clienteSessao.nome || '').trim()}%`;

                        dadosBanco = await sql`
                            SELECT * FROM pedidos 
                            WHERE LOWER(cliente_email) = ${emailFiltro} 
                               OR cliente_nome ILIKE ${nomeFiltro}
                            ORDER BY id DESC;
                        `;
                    } else {
                        dadosBanco = await sql`SELECT * FROM pedidos ORDER BY id DESC LIMIT 10;`;
                    }

                    if (Array.isArray(dadosBanco) && dadosBanco.length > 0) {
                        pedidosExibir = dadosBanco.map(p => {
                            let itensParsed = [];
                            let dadosExtra = {};
                            try {
                                const raw = typeof p.itens === 'string' ? JSON.parse(p.itens) : (p.itens || {});
                                if (Array.isArray(raw)) itensParsed = raw;
                                else {
                                    itensParsed = raw.itens || [];
                                    dadosExtra = raw;
                                }
                            } catch(e) {
                                itensParsed = [];
                            }

                            return {
                                id: p.id,
                                codigo: `#VR-${p.id}`,
                                data: new Date(p.criado_em).toLocaleDateString('pt-BR') + ' às ' + new Date(p.criado_em).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }),
                                itens: itensParsed,
                                formaPagamento: dadosExtra.forma_pagamento || p.forma_pagamento || 'PIX',
                                status: p.status || 'Pendente',
                                total: parseFloat(p.total || 0),
                                endereco: formatarEnderecoCompleto(dadosExtra.endereco_entrega || p.endereco_entrega || p.endereco),
                                tipoEnvio: dadosExtra.tipo_envio || 'entrega'
                            };
                        });
                    }
                }
            } catch (err) {
                console.warn('Busca local de pedidos ativada:', err);
            }

            if (pedidosExibir.length === 0) {
                const pedidosLocais = JSON.parse(localStorage.getItem('vr_modas_pedidos')) || [];
                if (pedidosLocais.length > 0) {
                    pedidosExibir = pedidosLocais.map(p => ({
                        id: p.id || '1',
                        codigo: `#VR-${p.id || '1'}`,
                        data: p.data || 'Hoje',
                        itens: p.itens || [],
                        formaPagamento: p.formaPagamento || 'PIX',
                        status: p.status || 'Pendente',
                        total: parseFloat(p.total || 0),
                        endereco: formatarEnderecoCompleto(p.endereco),
                        tipoEnvio: p.tipoEnvio || 'entrega'
                    }));
                }
            }

            if (pedidosExibir.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; color: #888; padding: 40px 20px; background: #131313; border-radius: 10px; border: 1px solid #222;">
                        <div style="font-size: 30px; margin-bottom: 8px;">🛍️</div>
                        <p style="margin: 0; font-size: 13.5px; color: #ccc;">Nenhum pedido encontrado.</p>
                        <a href="home.html" class="btn-voltar-link" style="margin-top: 12px; display: inline-block;">Ver Coleção</a>
                    </div>
                `;
                return;
            }

            const numSuporte = obterNumeroSuporteDinamico();

            container.innerHTML = pedidosExibir.map(ped => {
                const infoRastreio = calcularEtapaRastreio(ped.status);
                const totalValor = Number(ped.total || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
                const ehRetirada = ped.tipoEnvio === 'retirada' || ped.endereco.toLowerCase().includes('retirada');
                const localBusca = ehRetirada ? 'VR Modas' : encodeURIComponent(ped.endereco);
                const urlMapsApp = `https://www.google.com/maps/search/?api=1&query=${localBusca}`;

                const itensHTML = (ped.itens || []).map(it => {
                    const tam = extrairTextoTamanho(it.tamanho);
                    const cor = extrairTextoCor(it.cor);
                    const subtotal = (Number(it.preco || 0) * (it.quantidade || 1)).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
                    const foto = it.imagem || 'img/placeholder.png';

                    return `
                        <div style="display: flex; gap: 10px; align-items: center; background: #0c0c0c; border: 1px solid #1f1f1f; padding: 7px 10px; border-radius: 6px; margin-bottom: 6px;">
                            <img src="${foto}" style="width: 38px; height: 44px; object-fit: cover; border-radius: 4px; border: 1px solid #2a2a2a;" onerror="this.src='img/placeholder.png'">
                            <div style="flex: 1; min-width: 0;">
                                <div style="font-weight: 700; color: #fff; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${it.nome}</div>
                                <small style="color: #777; font-size: 10.5px;">Tam: <strong style="color: #bbb;">${tam}</strong> | Cor: <strong style="color: #bbb;">${cor}</strong></small>
                            </div>
                            <div style="text-align: right; flex-shrink: 0;">
                                <span style="font-size: 10px; color: #666;">${it.quantidade}x</span>
                                <div style="color: var(--dourado, #d4af37); font-size: 12px; font-weight: 700;">${subtotal}</div>
                            </div>
                        </div>
                    `;
                }).join('') || '<p style="color: #777; font-size: 11px;">Peças diversas</p>';

                const linkWhatsAppSuporte = numSuporte
                    ? `https://wa.me/55${numSuporte}?text=${encodeURIComponent(`Olá! Gostaria de acompanhar meu pedido ${ped.codigo} na VR Modas.`)}`
                    : `home.html#contato`;

                return `
                    <div class="card-pedido-cliente">
                        <!-- Topo com Código e Status em Badge -->
                        <div class="topo-card-pedido">
                            <div>
                                <strong style="color: var(--dourado, #d4af37); font-size: 14.5px;">${ped.codigo}</strong>
                                <div style="font-size: 10.5px; color: #777; margin-top: 1px;">${ped.data}</div>
                            </div>
                            <span style="font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 14px; background: rgba(255,255,255,0.04); border: 1px solid ${infoRastreio.cor}; color: ${infoRastreio.cor}; text-transform: uppercase;">
                                ${ped.status}
                            </span>
                        </div>

                        <!-- Steptracker Compacto -->
                        <div class="tracker-container">
                            <div class="tracker-linha-ativa" style="width: ${infoRastreio.porcentagem};"></div>

                            <div class="tracker-passo ${infoRastreio.passo >= 1 ? 'concluido' : ''} ${infoRastreio.passo === 1 ? 'ativo' : ''}">
                                <div class="tracker-circulo">1</div>
                                <span class="tracker-legenda">Confirmado</span>
                            </div>
                            <div class="tracker-passo ${infoRastreio.passo >= 2 ? 'concluido' : ''} ${infoRastreio.passo === 2 ? 'ativo' : ''}">
                                <div class="tracker-circulo">2</div>
                                <span class="tracker-legenda">Separação</span>
                            </div>
                            <div class="tracker-passo ${infoRastreio.passo >= 3 ? 'concluido' : ''} ${infoRastreio.passo === 3 ? 'ativo' : ''}">
                                <div class="tracker-circulo">3</div>
                                <span class="tracker-legenda">A Caminho</span>
                            </div>
                            <div class="tracker-passo ${infoRastreio.passo >= 4 ? 'concluido' : ''} ${infoRastreio.passo === 4 ? 'ativo' : ''}">
                                <div class="tracker-circulo">4</div>
                                <span class="tracker-legenda">Entregue</span>
                            </div>
                        </div>

                        <!-- Linha de Endereço Limpa com Botão GPS -->
                        <div style="background: #0d0d0d; border: 1px solid #1a1a1a; border-radius: 6px; padding: 8px 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px;">
                            <div style="flex: 1; min-width: 0;">
                                <small style="font-size: 9.5px; color: #666; text-transform: uppercase; font-weight: 700; display: block;">${ehRetirada ? 'Retirada no Balcão' : 'Entrega em'}</small>
                                <span style="font-size: 11px; color: #ccc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block;">${ped.endereco}</span>
                            </div>
                            <a href="${urlMapsApp}" target="_blank" style="background: #181818; border: 1px solid #2e2e2e; color: #4fc3f7; padding: 4px 8px; border-radius: 4px; font-size: 10.5px; font-weight: 700; text-decoration: none; flex-shrink: 0; display: inline-flex; align-items: center; gap: 3px;">
                                📍 GPS
                            </a>
                        </div>

                        <!-- Lista de Itens -->
                        <div style="margin-bottom: 10px;">
                            ${itensHTML}
                        </div>

                        <!-- Rodapé do Card -->
                        <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #1a1a1a; padding-top: 10px;">
                            <div>
                                <small style="font-size: 10px; color: #666; display: block;">${ped.formaPagamento}</small>
                                <strong style="color: var(--dourado, #d4af37); font-size: 15px;">${totalValor}</strong>
                            </div>
                            <a href="${linkWhatsAppSuporte}" target="_blank" style="background: #162419; border: 1px solid #264b2c; color: #4cd137; padding: 6px 12px; border-radius: 5px; font-size: 11px; font-weight: 700; text-decoration: none; display: inline-flex; align-items: center; gap: 4px;">
                                💬 Ajuda
                            </a>
                        </div>
                    </div>
                `;
            }).join('');
        }

        window.addEventListener('DOMContentLoaded', carregarPedidosTela);
    </script>
</body>
</html>
