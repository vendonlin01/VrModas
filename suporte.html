<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Suporte & Atendimento - VR Modas</title>
    <link rel="stylesheet" href="./css/global.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0a0a0a;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 0;
            height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        .header-suporte {
            background: #111;
            border-bottom: 1px solid #222;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .btn-voltar {
            color: var(--dourado, #d4af37);
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
        }

        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            padding: 14px;
            box-sizing: border-box;
            overflow-y: auto;
            gap: 12px;
        }

        .msg-box {
            max-width: 85%;
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.5;
        }

        .msg-bot {
            background: #181818;
            border: 1px solid #2c2c2c;
            color: #ddd;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .msg-user {
            background: var(--dourado, #d4af37);
            color: #000;
            font-weight: 600;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .opcoes-duvidas {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 8px;
        }

        .btn-duvida {
            background: #202020;
            border: 1px solid #333;
            color: #fff;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 12.5px;
            text-align: left;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            transition: all 0.2s;
        }

        .btn-duvida:hover {
            border-color: var(--dourado, #d4af37);
            background: #252525;
        }

        .btn-whatsapp-direto {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #25d366;
            color: #fff;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 13px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <header class="header-suporte">
        <a href="home.html" class="btn-voltar">⬅ Voltar</a>
        <div style="font-weight: 900; font-size: 15px;"><span style="color: var(--dourado, #d4af37);">VR</span> SUPORTE</div>
        <div style="width: 40px;"></div>
    </header>

    <main class="chat-container" id="chat-mensagens">
        <div class="msg-box msg-bot">
            Olá! Sou o assistente virtual da <strong>VR Modas</strong>. Como posso ajudar com a sua experiência hoje?
            <div class="opcoes-duvidas">
                <button type="button" class="btn-duvida" data-tipo="rastreio">📦 Onde está o meu pedido?</button>
                <button type="button" class="btn-duvida" data-tipo="pagamento">💳 Formas de pagamento e parcelamento</button>
                <button type="button" class="btn-duvida" data-tipo="troca">🔄 Como funciona a política de trocas?</button>
                <button type="button" class="btn-duvida" data-tipo="humano">💬 Falar no WhatsApp com uma atendente</button>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const configLoja = JSON.parse(localStorage.getItem('vr_modas_config')) || {
                whatsapp: "5589999999999",
                email: "contato@vrmodas.com"
            };

            const chat = document.getElementById('chat-mensagens');

            function rolarAbaixo() {
                chat.scrollTop = chat.scrollHeight;
            }

            document.querySelectorAll('.btn-duvida').forEach(btn => {
                btn.onclick = function() {
                    const tipo = this.getAttribute('data-tipo');
                    const textoPergunta = this.innerText;

                    chat.insertAdjacentHTML('beforeend', `<div class="msg-box msg-user">${textoPergunta}</div>`);

                    setTimeout(() => {
                        let respostaBot = '';

                        if (tipo === 'rastreio') {
                            respostaBot = `Você pode acompanhar todas as suas compras em tempo real acedendo à secção <a href="pedidos.html" style="color: var(--dourado, #d4af37); font-weight: bold;">Meus Pedidos</a> da nossa loja.`;
                        } else if (tipo === 'pagamento') {
                            respostaBot = `Aceitamos **Pix à vista** (com confirmação imediata), **Cartão de Débito** e **Cartão de Crédito** em até 12x com regras especiais por peça!`;
                        } else if (tipo === 'troca') {
                            respostaBot = `Garantimos trocas em até 7 dias corridos após o recebimento da peça, desde que esteja com a etiqueta original e sem sinais de uso.`;
                        } else if (tipo === 'humano') {
                            const linkWhats = `https://wa.me/${configLoja.whatsapp}?text=${encodeURIComponent("Olá! Gostaria de falar com uma atendente da VR Modas sobre um atendimento.")}`;
                            respostaBot = `
                                Perfeito! Clique no botão abaixo para conversar diretamente com a nossa equipa:
                                <a href="${linkWhats}" target="_blank" class="btn-whatsapp-direto">
                                    🟢 Iniciar Conversa no WhatsApp
                                </a>
                            `;
                        }

                        chat.insertAdjacentHTML('beforeend', `<div class="msg-box msg-bot">${respostaBot}</div>`);
                        rolarAbaixo();
                    }, 400);

                    rolarAbaixo();
                };
            });
        });
    </script>
</body>
</html>
