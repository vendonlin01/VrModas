<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Entrar - VR Modas</title>
    
    <link rel="stylesheet" href="./css/global.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(circle at top, #1a1a1a 0%, #0a0a0a 100%);
            color: var(--branco);
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            overflow-x: hidden;
            -webkit-text-size-adjust: 100%;
        }

        .login-wrapper {
            width: 100%;
            max-width: 400px;
            background: rgba(22, 22, 22, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 12px;
            padding: clamp(20px, 5vw, 36px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8), 0 0 20px rgba(212, 175, 55, 0.08);
            text-align: center;
        }

        .logo-box {
            font-size: 26px;
            font-weight: 900;
            margin-bottom: 8px;
            letter-spacing: 1.5px;
        }

        .logo-box .logo-vr { color: var(--dourado); }
        .logo-box .logo-modas { color: var(--branco); }

        .login-wrapper h1 {
            color: var(--branco);
            font-size: 20px;
            margin-bottom: 4px;
            font-weight: 700;
        }

        .login-wrapper p {
            color: var(--cinza-texto);
            font-size: 13px;
            margin-bottom: 22px;
            line-height: 1.4;
        }

        .campo-grupo {
            display: flex;
            flex-direction: column;
            text-align: left;
            margin-bottom: 14px;
            gap: 6px;
            width: 100%;
        }

        .campo-grupo label {
            color: #ccc;
            font-size: 12px;
            font-weight: 700;
        }

        .campo-grupo input {
            width: 100%;
            background: #0f0f0f;
            border: 1px solid #333;
            color: var(--branco);
            padding: 13px 14px;
            border-radius: 6px;
            font-family: 'Montserrat', sans-serif;
            font-size: 16px; /* Previne auto-zoom no iOS e Android */
            outline: none;
            transition: border-color 0.25s ease;
        }

        .campo-grupo input:focus {
            border-color: var(--dourado);
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.25);
        }

        .campo-grupo input::placeholder {
            color: #666;
            font-size: 13px;
        }

        .btn-entrar {
            width: 100%;
            background: linear-gradient(135deg, var(--dourado) 0%, #b5952f 100%);
            color: var(--preto);
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            margin-top: 8px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-entrar:active {
            transform: scale(0.98);
        }

        .msg-erro {
            color: #ff4444;
            font-size: 12px;
            font-weight: 700;
            margin-top: 12px;
            display: none;
            background: rgba(255, 68, 68, 0.1);
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid rgba(255, 68, 68, 0.3);
        }

        .login-footer {
            margin-top: 22px;
            font-size: 13px;
            color: var(--cinza-texto);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .login-footer a {
            color: var(--dourado);
            text-decoration: none;
            font-weight: 700;
        }

        .link-voltar {
            color: var(--cinza-texto) !important;
            font-size: 12px;
            font-weight: normal !important;
        }

        @media (max-width: 380px) {
            .login-wrapper {
                padding: 18px 14px;
            }
            .logo-box {
                font-size: 22px;
            }
            .login-wrapper h1 {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="logo-box">
            <span class="logo-vr">VR</span> <span class="logo-modas">MODAS</span>
        </div>
        <h1>Acesse sua Conta</h1>
        <p>Informe suas credenciais para entrar no sistema.</p>

        <form id="form-login">
            <div class="campo-grupo">
                <label for="login-email">E-mail</label>
                <input type="email" id="login-email" placeholder="seuemail@exemplo.com" inputmode="email" required>
            </div>

            <div class="campo-grupo">
                <label for="login-senha">Senha</label>
                <input type="password" id="login-senha" placeholder="Digite sua senha" required>
            </div>

            <button type="submit" class="btn-entrar">Entrar</button>
            <div id="msg-erro" class="msg-erro">E-mail ou senha incorretos!</div>
        </form>

        <div class="login-footer">
            <div>
                Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a>
            </div>
            <a href="home.html" class="link-voltar">⬅ Voltar para o Início da Loja</a>
        </div>
    </div>

    <script>
        document.getElementById('form-login').onsubmit = function(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim().toLowerCase();
            const senha = document.getElementById('login-senha').value;
            const erroEl = document.getElementById('msg-erro');

            // 1. CREDENCIAIS DO ADMINISTRADOR
            const ADMIN_EMAIL = "admin@vrmodas.com";
            const ADMIN_SENHA = "123456";

            if (email === ADMIN_EMAIL && senha === ADMIN_SENHA) {
                const sessaoAdmin = {
                    email: email,
                    role: "admin",
                    nome: "Administrador VR Modas"
                };
                sessionStorage.setItem('vr_usuario_ativo', JSON.stringify(sessaoAdmin));
                sessionStorage.setItem('vr_admin_logado', 'true');
                window.location.href = 'admin.html';
                return;
            }

            // 2. BUSCA NO BANCO DE CLIENTES
            const usuarios = JSON.parse(localStorage.getItem('vr_modas_usuarios')) || [];
            const cliente = usuarios.find(u => u.email === email && u.senha === senha);

            if (cliente) {
                const sessaoCliente = {
                    id: cliente.id,
                    email: cliente.email,
                    nome: cliente.nome,
                    whatsapp: cliente.whatsapp,
                    endereco: cliente.endereco,
                    role: "cliente"
                };
                sessionStorage.setItem('vr_usuario_ativo', JSON.stringify(sessaoCliente));
                sessionStorage.setItem('vr_cliente_dados', JSON.stringify(cliente));
                sessionStorage.setItem('vr_cliente_logado', 'true');

                alert(`Bem-vindo(a) de volta, ${cliente.nome}!`);
                window.location.href = 'home.html';
                return;
            }

            erroEl.style.display = 'block';
        };
    </script>
</body>
</html>
